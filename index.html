    <style>
        body {
            transition: background-color 0.3s, color 0.3s;

        /* Стили для Glassmorphism */
        .glass-dark {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-light {
            background: rgba(255, 255, 255, 0.7);

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Спиннер загрузки */
        .loader {
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

                </button>

    <!-- Основной контент -->
    <main class="flex-grow flex items-center justify-center p-4">

            <!-- ЭКРАН АВТОРИЗАЦИИ -->
            <div id="auth-screen" class="glass-light dark:glass-dark rounded-3xl p-6 sm:p-8 shadow-2xl transition-all">

                        <input id="auth-pass" type="password" placeholder="Пароль (минимум 8 символов)" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">

                    <div class="flex gap-3 pt-2">

                            <span>Войти</span>

                        <button id="btn-reg" onclick="register()" class="flex-1 flex justify-center items-center gap-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-semibold py-3 rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed">
                            <span>Создать</span>
                            <div class="loader hidden border-slate-500 dark:border-white" id="load-reg"></div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ГЛАВНЫЙ ЭКРАН (ПОСЛЕ ВХОДА) -->
            <div id="main-screen" class="hidden space-y-4">
                
                <!-- Меню -->
                <nav class="glass-light dark:glass-dark rounded-2xl p-1.5 flex gap-1 shadow-lg">
                    <button onclick="switchTab('steam')" id="tab-steam" class="flex-1 py-2.5 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-md transition">Стим</button>

                        Поддержка
                        <!-- Индикатор непрочитанных (визуальный) -->
                        <span class="absolute top-2 right-4 w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    </button>
                </nav>

                <!-- Вкладка: СТИМ -->
                <div id="content-steam" class="glass-light dark:glass-dark rounded-3xl p-6 shadow-xl">
                    <div class="text-center mb-6">
                        <div class="inline-block px-3 py-1 bg-blue-100 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400 rounded-full text-xs font-bold mb-3">Игровой Доступ</div>
                        <h2 class="text-2xl font-bold">Стим Аккаунт</h2>

                <div id="content-vpn" class="hidden glass-light dark:glass-dark rounded-3xl p-6 shadow-xl">

                    <!-- Админ Панель VPN -->
                    <div id="admin-vpn" class="hidden mb-4 p-4 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-500/20 space-y-3">
                        <p class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase">Добавить Ключ (Админ)</p>
                        <input id="vpn-name" type="text" placeholder="Название (например: Outline)" class="w-full px-3 py-2 bg-white dark:bg-slate-800 rounded-lg text-sm border border-slate-200 dark:border-slate-700 outline-none">
                        <input id="vpn-key" type="text" placeholder="Ключ (vless://...)" class="w-full px-3 py-2 bg-white dark:bg-slate-800 rounded-lg text-sm border border-slate-200 dark:border-slate-700 outline-none">
                        <button onclick="addVPN()" class="w-full py-2 bg-indigo-600 text-white font-bold rounded-lg text-sm">Выложить на сайт</button>

                        <!-- Список VPN -->

                <!-- Вкладка: ПОДДЕРЖКА -->
                <div id="content-support" class="hidden glass-light dark:glass-dark rounded-3xl p-4 shadow-xl flex flex-col h-[500px]">
                    
                    <!-- Шапка чата -->
                    <div class="border-b border-slate-200 dark:border-slate-700 pb-3 mb-3 flex justify-between items-center px-2">
                        <div>
                            <h3 class="font-bold text-sm">Оператор</h3>
                            <p class="text-[10px] text-green-500 font-semibold">В сети</p>
                        </div>
                        
                        <!-- Селектор для Админа -->
                        <div id="admin-chat-tools" class="hidden">
                            <select id="admin-user-select" onchange="changeChat(this.value)" class="text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 outline-none">
                                <option value="">Выберите чат</option>
                            </select>
                        </div>
                    </div>

                    <!-- Панель управления аккаунтом (Только Админ) -->

                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-amber-600 dark:text-amber-400">Управление запросом Steam</span>

                            <input id="admin-steam-data" type="text" placeholder="Логин:Пароль" class="flex-grow px-2 py-1.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none">
                            <button onclick="approveSteam()" class="px-3 bg-green-500 hover:bg-green-600 text-white rounded-lg text-xs font-bold transition">Выдать</button>

                    <!-- Ввод текста -->

                        <button onclick="sendMsg()" class="p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition shadow-md">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                        </button>

    </main>

    <script>
        // ИНИЦИАЛИЗАЦИЯ ТЕМЫ
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        // КОНФИГУРАЦИЯ APPWRITE
        const { Client, Account, Databases, ID } = Appwrite;
        const client = new Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('69f223f4002d7c30c1b9');
        const account = new Account(client);
        const databases = new Databases(client);

        const DB_ID = 'main_db';
        const COLL_VPN = 'vpn_keys';
        const COLL_STEAM = 'steam_requests';

        let user = null;
        let isAdmin = false;
        let activeTab = 'steam';
        let adminActiveChat = null; // ID пользователя, с которым общается админ

        // Уведомления (вместо alert)
        function notify(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl shadow-xl text-sm font-semibold transition-all duration-300 transform translate-y-10 opacity-0 ${isError ? 'bg-red-500 text-white' : 'bg-slate-800 text-white dark:bg-white dark:text-slate-800'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            
            // Анимация появления
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
            // Удаление
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Блокировка кнопок авторизации
        function setAuthLoading(btnId, loaderId, isLoading) {
            document.getElementById(btnId).disabled = isLoading;
            document.getElementById(loaderId).style.display = isLoading ? 'block' : 'none';
        }

        // ПРОВЕРКА СЕССИИ ПРИ ЗАГРУЗКЕ
        window.onload = async () => {
            try {
                user = await account.get();
                if(user) enterApp();
            } catch (e) {
                // нет сессии
            }
        };

        // РЕГИСТРАЦИЯ
        async function register() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if (!nick || pass.length < 8) return notify('Ник обязателен, пароль от 8 символов', true);

            setAuthLoading('btn-reg', 'load-reg', true);
            setAuthLoading('btn-login', 'load-login', true);

            try {
                const email = nick.toLowerCase() + "@sh.ru";
                await account.create(ID.unique(), email, pass, nick);
                await account.createEmailPasswordSession(email, pass);
                user = await account.get();
                
                // Создаем профиль в базе
                try {
                    await databases.createDocument(DB_ID, COLL_STEAM, user.$id, {
                        user_id: user.name,
                        status: 'none',
                        response: '[SYSTEM]: Добро пожаловать в поддержку!'
                    });
                } catch(err) {}

                enterApp();
                notify('Аккаунт успешно создан!');
            } catch (e) {
                notify('Ошибка: Ник уже занят или ошибка соединения', true);
            } finally {
                setAuthLoading('btn-reg', 'load-reg', false);
                setAuthLoading('btn-login', 'load-login', false);
            }
        }

        // ВХОД
        async function login() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if (!nick || !pass) return notify('Заполните все поля', true);

            setAuthLoading('btn-reg', 'load-reg', true);
            setAuthLoading('btn-login', 'load-login', true);

            try {
                const email = nick.toLowerCase() + "@sh.ru";
                await account.createEmailPasswordSession(email, pass);
                user = await account.get();
                enterApp();
                notify('Успешный вход!');
            } catch (e) {
                notify('Неверный ник или пароль', true);
            } finally {
                setAuthLoading('btn-reg', 'load-reg', false);
                setAuthLoading('btn-login', 'load-login', false);
            }
        }

        // ВЫХОД
        async function logout() {
            try { await account.deleteSession('current'); } catch(e){}
            location.reload();
        }

        // ИНИЦИАЛИЗАЦИЯ ИНТЕРФЕЙСА
        function enterApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('user-header').style.display = 'flex';
            document.getElementById('header-name').innerText = user.name;

            // Админ проверка
            if (user.email === 'admin@sh.ru' || user.name.toLowerCase() === 'admin') {
                isAdmin = true;
                document.getElementById('header-role').innerText = 'Администратор';
                document.getElementById('header-role').classList.add('text-indigo-500');
                document.getElementById('admin-vpn').style.display = 'block';
                document.getElementById('admin-chat-tools').style.display = 'block';
            }

            switchTab('steam');
            setInterval(syncData, 5000); // Обновление каждые 5 сек
        }

        // ВКЛАДКИ
        function switchTab(tab) {
            activeTab = tab;
            ['steam', 'vpn', 'support'].forEach(t => {
                const btn = document.getElementById('tab-' + t);
                const content = document.getElementById('content-' + t);
                if (t === tab) {
                    btn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-md transition";
                    content.style.display = 'block';
                } else {
                    btn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition";
                    content.style.display = 'none';
                }
            });
            syncData();
        }

        // ОБНОВЛЕНИЕ ДАННЫХ
        async function syncData() {
            if (!user) return;
            if (activeTab === 'steam') await renderSteam();
            if (activeTab === 'vpn') await renderVPN();
            if (activeTab === 'support') await renderChat();
        }

        // --- СТИМ ---
        async function renderSteam() {
            const ui = document.getElementById('steam-ui');
            if (isAdmin) {
                ui.innerHTML = `<p class="text-indigo-500 font-semibold mb-2">Режим Администратора</p><p class="text-sm text-slate-500">Выдавайте аккаунты во вкладке Поддержка.</p>`;
                return;
            }

            try {
                const doc = await databases.getDocument(DB_ID, COLL_STEAM, user.$id);
                
                if (doc.status === 'none') {
                    ui.innerHTML = `
                        <p class="text-sm text-slate-500 mb-6">Нажмите кнопку ниже, чтобы запросить аккаунт. Выдача происходит в чате поддержки.</p>
                        <button onclick="requestSteam()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/30 transition transform active:scale-95 text-lg">
                            Запросить Аккаунт
                        </button>
                    `;
                } else if (doc.status === 'pending') {
                    ui.innerHTML = `
                        <div class="p-6 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                            <div class="inline-flex items-center gap-2 text-amber-500 font-bold mb-2">
                                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                                Запрос отправлен
                            </div>
                            <p class="text-sm text-slate-600 dark:text-slate-400">Ожидайте. Оператор пришлет логин и пароль в сообщении с <b>Поддержкой</b>.</p>
                        </div>
                    `;
                } else if (doc.status === 'approved') {
                    ui.innerHTML = `
                        <div class="p-6 rounded-2xl bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20">
                            <h3 class="text-green-600 dark:text-green-400 font-bold mb-2">✅ Аккаунт выдан!</h3>
                            <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">Данные отправлены вам в чат Поддержки.</p>
                            <button onclick="resetSteam()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-semibold rounded-xl text-sm transition">Понятно, закрыть статус</button>
                        </div>
                    `;
                }
            } catch (e) {
                // Если документа нет, пересоздадим
                await databases.createDocument(DB_ID, COLL_STEAM, user.$id, { user_id: user.name, status: 'none', response: '' });
                renderSteam();
            }
        }

        async function requestSteam() {
            try {
                const doc = await databases.getDocument(DB_ID, COLL_STEAM, user.$id);
                const history = doc.response || "";
                await databases.updateDocument(DB_ID, COLL_STEAM, user.$id, {
                    status: 'pending',
                    response: `[SYSTEM]: Пользователь запросил Стим аккаунт.\n${history}`
                });
                renderSteam();
                notify('Запрос успешно отправлен!');
            } catch (e) { notify('Ошибка отправки', true); }
        }

        async function resetSteam() {
            try {
                await databases.updateDocument(DB_ID, COLL_STEAM, user.$id, { status: 'none' });
                renderSteam();
            } catch (e) { notify('Ошибка', true); }
        }

        // --- VPN ---
        async function renderVPN() {
            const list = document.getElementById('vpn-list');
            try {
                const res = await databases.listDocuments(DB_ID, COLL_VPN);
                list.innerHTML = '';
                if(res.documents.length === 0) {
                    list.innerHTML = '<p class="text-center text-sm text-slate-500 py-4">Ключи пока не добавлены.</p>';
                    return;
                }

                res.documents.forEach(doc => {
                    const btnDel = isAdmin ? `<button onclick="delVPN('${doc.$id}')" class="text-xs text-red-500 hover:underline">Удалить</button>` : '';
                    list.innerHTML += `
                        <div class="p-4 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-sm">${doc.name}</span>
                                ${btnDel}
                            </div>
                            <div class="flex gap-2">
                                <input type="text" value="${doc.key}" readonly class="flex-grow px-3 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-mono text-green-600 dark:text-green-400 outline-none">
                                <button onclick="copyToClipboard('${doc.key}')" class="px-3 py-1.5 bg-blue-100 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 font-bold rounded-lg text-xs hover:bg-blue-200 dark:hover:bg-blue-500/30 transition">Копия</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {}
        }

        async function addVPN() {
            const name = document.getElementById('vpn-name').value;
            const key = document.getElementById('vpn-key').value;
            if(!name || !key) return notify('Заполните поля', true);
            try {
                await databases.createDocument(DB_ID, COLL_VPN, ID.unique(), { name, key });
                document.getElementById('vpn-name').value = '';
                document.getElementById('vpn-key').value = '';
                renderVPN();
                notify('Ключ добавлен');
            } catch (e) { notify('Ошибка добавления', true); }
        }

        async function delVPN(id) {
            try { await databases.deleteDocument(DB_ID, COLL_VPN, id); renderVPN(); } catch (e) {}
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => notify('Скопировано!'));
        }

        // --- ЧАТ ПОДДЕРЖКИ ---
        async function renderChat() {
            const box = document.getElementById('chat-box');
            
            if (isAdmin) {
                // Логика Админа: стянуть список пользователей
                try {
                    const res = await databases.listDocuments(DB_ID, COLL_STEAM);
                    const sel = document.getElementById('admin-user-select');
                    const currentVal = sel.value;
                    sel.innerHTML = '<option value="">Выберите пользователя</option>';
                    
                    let activeDoc = null;

                    res.documents.forEach(doc => {
                        let label = doc.user_id;
                        if (doc.status === 'pending') label = `🔴 ЗАПРОС: ${doc.user_id}`;
                        sel.innerHTML += `<option value="${doc.$id}">${label}</option>`;
                        if (doc.$id === currentVal) activeDoc = doc;
                    });
                    sel.value = currentVal;
                    adminActiveChat = currentVal;

                    if (adminActiveChat && activeDoc) {
                        document.getElementById('admin-steam-tools').style.display = activeDoc.status === 'pending' ? 'block' : 'none';
                        drawMessages(activeDoc.response);
                    } else {
                        box.innerHTML = '<div class="text-center text-xs text-slate-400 my-auto">Выберите чат из списка сверху</div>';
                        document.getElementById('admin-steam-tools').style.display = 'none';
                    }
                } catch (e) {}
            } else {
                // Логика Юзера
                try {
                    const doc = await databases.getDocument(DB_ID, COLL_STEAM, user.$id);
                    drawMessages(doc.response);
                } catch (e) {}
            }
        }

        function drawMessages(history) {
            const box = document.getElementById('chat-box');
            if (!history) {
                box.innerHTML = '<div class="text-center text-xs text-slate-400 my-auto">История пуста</div>';
                return;
            }

            const lines = history.split('\n').filter(l => l.trim() !== '').reverse();
            let html = '';
            
            lines.forEach(line => {
                if (line.startsWith('[SYSTEM]:')) {
                    html += `<div class="mx-auto my-2 px-3 py-1 bg-slate-200 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-[10px] rounded-lg max-w-[90%] text-center">${line.replace('[SYSTEM]:', '').trim()}</div>`;
                } else if (line.startsWith('Admin:')) {
                    html += `<div class="mr-auto my-1 p-3 bg-indigo-100 dark:bg-indigo-500/20 text-indigo-900 dark:text-indigo-100 rounded-2xl rounded-tl-none max-w-[85%] border border-indigo-200 dark:border-indigo-500/30">
                        <span class="block text-[10px] font-bold text-indigo-500 uppercase mb-0.5">Оператор</span>
                        ${line.replace('Admin:', '').trim()}
                    </div>`;
                } else if (line.startsWith('User:')) {
                    html += `<div class="ml-auto my-1 p-3 bg-blue-600 text-white rounded-2xl rounded-tr-none max-w-[85%]">
                        <span class="block text-[10px] font-bold text-blue-200 uppercase mb-0.5">Вы</span>
                        ${line.replace('User:', '').trim()}
                    </div>`;
                }
            });
            
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight; // Скролл вниз
        }

        function changeChat(userId) {
            adminActiveChat = userId;
            renderChat();
        }

        async function sendMsg() {
            const inp = document.getElementById('chat-input');
            const txt = inp.value.trim();
            if(!txt) return;

            const targetId = isAdmin ? adminActiveChat : user.$id;
            if(!targetId) return notify('Сначала выберите чат', true);

            try {
                const doc = await databases.getDocument(DB_ID, COLL_STEAM, targetId);
                const prefix = isAdmin ? 'Admin: ' : 'User: ';
                await databases.updateDocument(DB_ID, COLL_STEAM, targetId, {
                    response: `${prefix}${txt}\n${doc.response || ''}`
                });
                inp.value = '';
                renderChat();
            } catch (e) { notify('Ошибка отправки', true); }
        }

        // Админ выдает аккаунт
        async function approveSteam() {
            if (!adminActiveChat) return;
            const data = document.getElementById('admin-steam-data').value.trim();
            if (!data) return notify('Введите логин и пароль', true);

            try {
                const doc = await databases.getDocument(DB_ID, COLL_STEAM, adminActiveChat);
                const msg = `[SYSTEM]: Оператор выдал аккаунт:\nAdmin: ${data}`;
                
                await databases.updateDocument(DB_ID, COLL_STEAM, adminActiveChat, {
                    status: 'approved',
                    response: `${msg}\n${doc.response || ''}`
                });
                document.getElementById('admin-steam-data').value = '';
                notify('Аккаунт выдан!');
                renderChat();
            } catch (e) { notify('Ошибка выдачи', true); }
        }
    </script>
</body>
</html>
