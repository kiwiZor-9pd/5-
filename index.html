```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Hub - Premium</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at top right, #e0e7ff, #f8fafc, #f1f5f9);
            color: #1e293b;
        }
        /* Стили для Glassmorphism (Стекло) */
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Спиннер загрузки */
        .loader {
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            width: 1.2rem;
            height: 1.2rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Уведомления -->
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Шапка -->
    <header class="w-full glass sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center font-bold text-white shadow-md">SH</div>
                <h1 class="font-bold text-xl tracking-tight text-slate-800">Service Hub</h1>
            </div>
            
            <div id="user-header" class="hidden flex items-center gap-4 border-l border-slate-200 pl-4">
                <div class="text-right flex flex-col justify-center">
                    <span id="header-name" class="text-sm font-bold text-blue-600 leading-tight"></span>
                    <span id="header-role" class="text-[10px] uppercase font-bold text-slate-400">Пользователь</span>
                </div>
                <button onclick="logout()" title="Выйти" class="p-2 bg-red-50 text-red-500 hover:bg-red-100 rounded-xl transition">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-lg">
            
            <!-- ЭКРАН АВТОРИЗАЦИИ -->
            <div id="auth-screen" class="glass rounded-3xl p-8 shadow-2xl transition-all">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-slate-800 mb-1">Доступ к сервисам</h2>
                    <p class="text-sm text-slate-500">Войдите или зарегистрируйтесь по Нику</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <input id="auth-nick" type="text" placeholder="Ваш Никнейм" class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-slate-800 shadow-sm">
                    </div>
                    <div>
                        <input id="auth-pass" type="password" placeholder="Пароль (минимум 8 символов)" class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-slate-800 shadow-sm">
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button id="btn-login" onclick="login()" class="flex-1 flex justify-center items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition disabled:opacity-50 shadow-lg shadow-blue-500/30">
                            <span>Войти</span>
                            <div class="loader hidden" id="load-login"></div>
                        </button>
                        <button id="btn-reg" onclick="register()" class="flex-1 flex justify-center items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 rounded-xl transition border border-slate-200 disabled:opacity-50">
                            <span>Создать</span>
                            <div class="loader hidden border-slate-400" id="load-reg"></div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ГЛАВНЫЙ ЭКРАН (ПОСЛЕ ВХОДА) -->
            <div id="main-screen" class="hidden space-y-4">
                
                <!-- Меню -->
                <nav class="glass rounded-2xl p-1.5 flex gap-1 shadow-md">
                    <button onclick="switchTab('vpn')" id="tab-vpn" class="flex-1 py-3 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition">VPN Ключи</button>
                    <button onclick="switchTab('support')" id="tab-support" class="flex-1 py-3 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-md transition relative">
                        Поддержка / Steam
                        <span class="absolute top-2 right-4 w-2 h-2 bg-green-400 rounded-full animate-pulse border border-white"></span>
                    </button>
                </nav>

                <!-- Вкладка: VPN -->
                <div id="content-vpn" class="hidden glass rounded-3xl p-6 shadow-xl">
                    <h2 class="text-xl font-bold mb-4 text-slate-800">VPN Доступ</h2>
                    
                    <!-- Админ Панель VPN -->
                    <div id="admin-vpn" class="hidden mb-4 p-4 rounded-xl bg-indigo-50 border border-indigo-100 space-y-3">
                        <p class="text-xs font-bold text-indigo-600 uppercase">Добавить Ключ (Админ)</p>
                        <input id="vpn-name" type="text" placeholder="Название (например: Outline)" class="w-full px-3 py-2.5 bg-white rounded-lg text-sm border border-slate-200 outline-none focus:border-indigo-400">
                        <input id="vpn-key" type="text" placeholder="Ключ (vless://...)" class="w-full px-3 py-2.5 bg-white rounded-lg text-sm border border-slate-200 outline-none focus:border-indigo-400">
                        <button onclick="addVPN()" class="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-lg text-sm shadow-md">Выложить на сайт</button>
                    </div>

                    <div id="vpn-list" class="space-y-3 max-h-[350px] overflow-y-auto custom-scroll pr-2">
                        <div class="text-center text-sm text-slate-400 py-4">Загрузка ключей...</div>
                    </div>
                </div>

                <!-- Вкладка: ПОДДЕРЖКА И СТИМ -->
                <div id="content-support" class="glass rounded-3xl p-4 sm:p-6 shadow-xl flex flex-col h-[550px]">
                    
                    <!-- Шапка чата -->
                    <div class="border-b border-slate-100 pb-3 mb-3 flex justify-between items-center px-2">
                        <div class="flex items-center gap-2">
                            <div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-800">Связь с оператором</h3>
                            </div>
                        </div>
                        
                        <!-- Селектор для Админа -->
                        <div id="admin-chat-tools" class="hidden">
                            <select id="admin-user-select" onchange="changeChat(this.value)" class="text-xs bg-white border border-slate-200 rounded-lg px-3 py-1.5 outline-none font-medium shadow-sm cursor-pointer">
                                <option value="">Выберите чат...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Панель управления аккаунтом (Только Админ) -->
                    <div id="admin-steam-tools" class="hidden mb-3 p-3 bg-amber-50 border border-amber-200 rounded-xl">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-amber-700">Пользователь запросил Стим</span>
                        </div>
                        <div class="flex gap-2">
                            <input id="admin-steam-data" type="text" placeholder="Логин:Пароль" class="flex-grow px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg outline-none">
                            <button onclick="approveSteam()" class="px-4 bg-green-500 hover:bg-green-600 text-white rounded-lg text-xs font-bold transition shadow-sm">Выдать</button>
                        </div>
                    </div>

                    <!-- Окно сообщений -->
                    <div id="chat-box" class="flex-grow overflow-y-auto custom-scroll pr-2 space-y-3 pb-2 text-sm flex flex-col">
                        <div class="text-center text-xs text-slate-400 my-auto">Загрузка чата...</div>
                    </div>

                    <!-- Кнопка запроса Стим (Для обычного юзера) -->
                    <div id="user-steam-action" class="hidden mb-3 border-t border-slate-100 pt-3">
                        <button onclick="requestSteam()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95 flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            Запросить Стим Аккаунт
                        </button>
                    </div>

                    <!-- Ввод текста -->
                    <div class="pt-3 flex gap-2 border-t border-slate-100 mt-auto">
                        <input id="chat-input" type="text" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMsg()" class="flex-grow px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-400 focus:bg-white text-sm transition">
                        <button onclick="sendMsg()" class="p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition shadow-md">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // КОНФИГУРАЦИЯ APPWRITE
        const { Client, Account, Databases, ID, Query } = Appwrite;
        const client = new Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('69f223f4002d7c30c1b9');
        const account = new Account(client);
        const databases = new Databases(client);

        const DB_ID = 'main_db';
        const COLL_VPN = 'vpn_keys';
        const COLL_STEAM = 'steam_requests';

        let user = null;
        let isAdmin = false;
        let activeTab = 'support';
        
        let userDocId = null; // ID документа текущего пользователя в базе steam_requests
        let adminActiveDocId = null; // ID документа, который просматривает админ

        // Красивые уведомления
        function notify(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-2xl shadow-xl text-sm font-bold transition-all duration-300 transform -translate-y-10 opacity-0 ${isError ? 'bg-red-500 text-white' : 'bg-white text-slate-800 border border-slate-100'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('-translate-y-10', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-5');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setAuthLoading(btnId, loaderId, isLoading) {
            document.getElementById(btnId).disabled = isLoading;
            document.getElementById(loaderId).style.display = isLoading ? 'block' : 'none';
        }

        // ПРОВЕРКА СЕССИИ
        window.onload = async () => {
            try {
                user = await account.get();
                if(user) enterApp();
            } catch (e) {}
        };

        // РЕГИСТРАЦИЯ
        async function register() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if (!nick || pass.length < 8) return notify('Ник обязателен, пароль от 8 символов', true);

            setAuthLoading('btn-reg', 'load-reg', true);
            setAuthLoading('btn-login', 'load-login', true);

            try {
                const email = nick.toLowerCase() + "@sh.ru";
                await account.create(ID.unique(), email, pass, nick);
                await account.createEmailPasswordSession(email, pass);
                user = await account.get();
                
                enterApp();
                notify('Аккаунт успешно создан!');
            } catch (e) {
                notify('Ошибка: Ник уже занят.', true);
            } finally {
                setAuthLoading('btn-reg', 'load-reg', false);
                setAuthLoading('btn-login', 'load-login', false);
            }
        }

        // ВХОД
        async function login() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if (!nick || !pass) return notify('Заполните все поля', true);

            setAuthLoading('btn-reg', 'load-reg', true);
            setAuthLoading('btn-login', 'load-login', true);

            try {
                const email = nick.toLowerCase() + "@sh.ru";
                await account.createEmailPasswordSession(email, pass);
                user = await account.get();
                enterApp();
                notify('Успешный вход!');
            } catch (e) {
                notify('Неверный ник или пароль', true);
            } finally {
                setAuthLoading('btn-reg', 'load-reg', false);
                setAuthLoading('btn-login', 'load-login', false);
            }
        }

        // ВЫХОД
        async function logout() {
            try { await account.deleteSession('current'); } catch(e){}
            location.reload();
        }

        // ИНИЦИАЛИЗАЦИЯ ИНТЕРФЕЙСА ПОСЛЕ ВХОДА
        async function enterApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('user-header').style.display = 'flex';
            document.getElementById('header-name').innerText = user.name;

            // САМОЕ ВАЖНОЕ: Проверка на Админа по Нику
            if (user.name.toLowerCase() === 'admin') {
                isAdmin = true;
                document.getElementById('header-role').innerText = 'Администратор';
                document.getElementById('header-role').classList.add('text-indigo-500');
                document.getElementById('admin-vpn').style.display = 'block';
                document.getElementById('admin-chat-tools').style.display = 'block';
            } else {
                // Если обычный юзер, инициализируем его документ базы данных
                await initUserDoc();
            }

            switchTab('support');
            setInterval(syncData, 4000); // Обновление чата и данных каждые 4 сек
        }

        // Инициализация профиля в базе (безопасное создание)
        async function initUserDoc() {
            try {
                // Ищем документ пользователя
                const res = await databases.listDocuments(DB_ID, COLL_STEAM, [
                    Query.equal('user_id', user.$id)
                ]);
                
                if (res.total > 0) {
                    userDocId = res.documents[0].$id;
                } else {
                    // Создаем, если нет
                    const newDoc = await databases.createDocument(DB_ID, COLL_STEAM, ID.unique(), {
                        user_id: user.$id,
                        status: 'none',
                        response: '[SYSTEM]: Добро пожаловать! Здесь вы можете общаться с поддержкой.'
                    });
                    userDocId = newDoc.$id;
                }
            } catch (e) {
                console.error("Ошибка БД", e);
            }
        }

        // ВКЛАДКИ
        function switchTab(tab) {
            activeTab = tab;
            ['vpn', 'support'].forEach(t => {
                const btn = document.getElementById('tab-' + t);
                const content = document.getElementById('content-' + t);
                if (t === tab) {
                    btn.className = "flex-1 py-3 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-md transition relative";
                    content.style.display = 'flex';
                } else {
                    btn.className = "flex-1 py-3 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition relative";
                    content.style.display = 'none';
                }
            });
            syncData();
        }

        // ОБНОВЛЕНИЕ ДАННЫХ
        async function syncData() {
            if (!user) return;
            if (activeTab === 'vpn') await renderVPN();
            if (activeTab === 'support') await renderChat();
        }

        // --- VPN ---
        async function renderVPN() {
            const list = document.getElementById('vpn-list');
            try {
                const res = await databases.listDocuments(DB_ID, COLL_VPN);
                if(res.documents.length === 0) {
                    list.innerHTML = '<p class="text-center text-sm text-slate-500 py-4">Ключи пока не добавлены.</p>';
                    return;
                }

                let html = '';
                res.documents.forEach(doc => {
                    const btnDel = isAdmin ? `<button onclick="delVPN('${doc.$id}')" class="text-xs text-red-500 hover:bg-red-50 px-2 py-1 rounded">Удалить</button>` : '';
                    html += `
                        <div class="p-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-sm text-slate-800">${doc.name}</span>
                                ${btnDel}
                            </div>
                            <div class="flex gap-2">
                                <input type="text" value="${doc.key}" readonly class="flex-grow px-3 py-2 bg-slate-50 border border-slate-100 rounded-lg text-xs font-mono text-green-600 outline-none">
                                <button onclick="copyToClipboard('${doc.key}')" class="px-4 py-2 bg-blue-50 text-blue-600 font-bold rounded-lg text-xs hover:bg-blue-100 transition">Копия</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch (e) {}
        }

        async function addVPN() {
            const name = document.getElementById('vpn-name').value;
            const key = document.getElementById('vpn-key').value;
            if(!name || !key) return notify('Заполните все поля', true);
            try {
                await databases.createDocument(DB_ID, COLL_VPN, ID.unique(), { name, key });
                document.getElementById('vpn-name').value = '';
                document.getElementById('vpn-key').value = '';
                renderVPN();
                notify('VPN Ключ выложен на сайт');
            } catch (e) { notify('Ошибка добавления', true); }
        }

        async function delVPN(id) {
            try { await databases.deleteDocument(DB_ID, COLL_VPN, id); renderVPN(); } catch (e) {}
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => notify('Ключ скопирован!'));
        }

        // --- ЧАТ И СТИМ ---
        async function renderChat() {
            const box = document.getElementById('chat-box');
            
            if (isAdmin) {
                // ЛОГИКА АДМИНА
                try {
                    const res = await databases.listDocuments(DB_ID, COLL_STEAM);
                    const sel = document.getElementById('admin-user-select');
                    const currentVal = sel.value;
                    
                    let selHtml = '<option value="">Выберите чат пользователя...</option>';
                    let activeDoc = null;

                    res.documents.forEach(doc => {
                        let label = `ID: ${doc.user_id.substring(0,6)}...`;
                        if (doc.status === 'pending') label = `🔴 ЗАПРОС СТИМ!`;
                        else if (doc.status === 'approved') label = `✅ Выдан`;
                        
                        selHtml += `<option value="${doc.$id}">${label}</option>`;
                        if (doc.$id === currentVal) activeDoc = doc;
                    });
                    sel.innerHTML = selHtml;
                    sel.value = currentVal;
                    adminActiveDocId = currentVal;

                    if (adminActiveDocId && activeDoc) {
                        document.getElementById('admin-steam-tools').style.display = activeDoc.status === 'pending' ? 'block' : 'none';
                        drawMessages(activeDoc.response);
                    } else {
                        box.innerHTML = '<div class="text-center text-xs text-slate-400 my-auto">Выберите пользователя сверху для начала общения</div>';
                        document.getElementById('admin-steam-tools').style.display = 'none';
                    }
                } catch (e) {}
            } else {
                // ЛОГИКА ОБЫЧНОГО ПОЛЬЗОВАТЕЛЯ
                if(!userDocId) return;
                try {
                    const doc = await databases.getDocument(DB_ID, COLL_STEAM, userDocId);
                    
                    // Управление кнопкой запроса
                    const steamBtnBox = document.getElementById('user-steam-action');
                    if (doc.status === 'none') {
                        steamBtnBox.style.display = 'block'; // Показываем кнопку
                    } else {
                        steamBtnBox.style.display = 'none'; // Прячем кнопку
                    }

                    drawMessages(doc.response);
                } catch (e) {}
            }
        }

        // Отрисовка сообщений
        function drawMessages(history) {
            const box = document.getElementById('chat-box');
            if (!history) {
                box.innerHTML = '<div class="text-center text-xs text-slate-400 my-auto">История пуста</div>';
                return;
            }

            const lines = history.split('\n').filter(l => l.trim() !== '').reverse();
            let html = '';
            
            lines.forEach(line => {
                if (line.startsWith('[SYSTEM]:')) {
                    html += `<div class="mx-auto my-2 px-4 py-1.5 bg-slate-100 text-slate-500 font-medium text-[10px] rounded-xl max-w-[90%] text-center">${line.replace('[SYSTEM]:', '').trim()}</div>`;
                } else if (line.startsWith('Admin:')) {
                    html += `<div class="mr-auto my-1 p-3 bg-indigo-50 text-indigo-900 rounded-2xl rounded-tl-none max-w-[85%] border border-indigo-100 shadow-sm">
                        <span class="block text-[9px] font-bold text-indigo-500 uppercase mb-1">Оператор</span>
                        ${line.replace('Admin:', '').trim()}
                    </div>`;
                } else if (line.startsWith('User:')) {
                    html += `<div class="ml-auto my-1 p-3 bg-blue-600 text-white rounded-2xl rounded-tr-none max-w-[85%] shadow-sm">
                        <span class="block text-[9px] font-bold text-blue-200 uppercase mb-1">Вы</span>
                        ${line.replace('User:', '').trim()}
                    </div>`;
                }
            });
            
            // Защита от автоскролла если юзер читает историю
            const isScrolledToBottom = box.scrollHeight - box.clientHeight <= box.scrollTop + 50;
            box.innerHTML = html;
            if (isScrolledToBottom) {
                box.scrollTop = box.scrollHeight;
            }
        }

        function changeChat(docId) {
            adminActiveDocId = docId;
            renderChat();
        }

        // Пользователь нажимает "Запросить аккаунт"
        async function requestSteam() {
            if(!userDocId) return;
            try {
                const doc = await databases.getDocument(DB_ID, COLL_STEAM, userDocId);
                const history = doc.response || "";
                
                await databases.updateDocument(DB_ID, COLL_STEAM, userDocId, {
                    status: 'pending',
                    response: `[SYSTEM]: Вы отправили запрос на игровой аккаунт Стим. Ожидайте ответа оператора.\n${history}`
                });
                
                document.getElementById('user-steam-action').style.display = 'none';
                renderChat();
                notify('Запрос отправлен оператору!');
            } catch (e) { notify('Ошибка отправки', true); }
        }

        // Админ выдает аккаунт
        async function approveSteam() {
            if (!adminActiveDocId) return;
            const data = document.getElementById('admin-steam-data').value.trim();
            if (!data) return notify('Введите логин:пароль', true);

            try {
                const doc = await databases.getDocument(DB_ID, COLL_STEAM, adminActiveDocId);
                const msg = `[SYSTEM]: ✅ Оператор одобрил ваш запрос и выдал аккаунт:\nAdmin: ${data}`;
                
                await databases.updateDocument(DB_ID, COLL_STEAM, adminActiveDocId, {
                    status: 'approved',
                    response: `${msg}\n${doc.response || ''}`
                });
                
                document.getElementById('admin-steam-data').value = '';
                notify('Аккаунт успешно отправлен!');
                renderChat();
            } catch (e) { notify('Ошибка выдачи', true); }
        }

        // Отправка сообщений в чат
        async function sendMsg() {
            const inp = document.getElementById('chat-input');
            const txt = inp.value.trim();
            if(!txt) return;

            const targetId = isAdmin ? adminActiveDocId : userDocId;
            if(!targetId) return notify(isAdmin ? 'Сначала выберите пользователя вверху' : 'Ошибка профиля', true);

            try {
                const doc = await databases.getDocument(DB_ID, COLL_STEAM, targetId);
                const prefix = isAdmin ? 'Admin: ' : 'User: ';
                await databases.updateDocument(DB_ID, COLL_STEAM, targetId, {
                    response: `${prefix}${txt}\n${doc.response || ''}`
                });
                inp.value = '';
                renderChat();
                
                const box = document.getElementById('chat-box');
                setTimeout(() => box.scrollTop = box.scrollHeight, 100);
            } catch (e) { notify('Ошибка отправки сообщения', true); }
        }
    </script>
</body>
</html>
